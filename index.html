    <title>Kintsugido</title>
    <script>
      // Apply a stored light or dark choice before first paint (src/shell/theme.ts).
      (() => {
        let choice = null;
        try {
          choice = window.localStorage.getItem('kintsugido.theme');
        } catch {
          // Storage refused: follow the device's own light or dark setting.
        }
        if (choice === 'light' || choice === 'dark') {
          document.documentElement.setAttribute('data-theme', choice);
        }
      })();
    </script>
